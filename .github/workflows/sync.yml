name: Sync Google Sheets to KeyCRM and Shopify

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (no writes to CRM or Shopify)"
        required: false
        default: "false"
        type: string
      sku:
        description: "Filter by one base SKU (optional)"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run sync
        env:
          KEYCRM_API_KEY: ${{ secrets.KEYCRM_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          export KEYCRM_BASE_URL="${KEYCRM_BASE_URL:-https://openapi.keycrm.app/v1}"
          export KEYCRM_RATE_LIMIT_PER_MIN="${KEYCRM_RATE_LIMIT_PER_MIN:-18}"
          export KEYCRM_WAREHOUSE_KYIV_ID="${KEYCRM_WAREHOUSE_KYIV_ID:-1}"
          export KEYCRM_WAREHOUSE_LUTSK_ID="${KEYCRM_WAREHOUSE_LUTSK_ID:-1}"
          export RESERVE_MODE="${RESERVE_MODE:-ignore}"
          export GOOGLE_SHEET_GIDS="${GOOGLE_SHEET_GIDS:-1934858652,1441866253,1265295383,1829566062,0,588886751}"
          export SHOPIFY_ENABLED="${SHOPIFY_ENABLED:-true}"
          export SHOPIFY_STORE_DOMAIN="${SHOPIFY_STORE_DOMAIN:-tnwtdg-rm.myshopify.com}"
          export SHOPIFY_API_VERSION="${SHOPIFY_API_VERSION:-2025-01}"
          export SHOPIFY_LOCATION_KYIV_ID="${SHOPIFY_LOCATION_KYIV_ID:-75696504907}"

          ARGS=("sync")
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=("--dry-run")
          fi
          if [ -n "${{ inputs.sku }}" ]; then
            ARGS+=("--sku=${{ inputs.sku }}")
          fi
          node src/index.js "${ARGS[@]}" > sync-summary.json
          cat sync-summary.json

      - name: Publish step summary
        if: always() && hashFiles('sync-summary.json') != ''
        run: |
          node -e '
            const fs = require("fs");
            try {
              const s = JSON.parse(fs.readFileSync("sync-summary.json", "utf8"));
              const counts = (s.plan||[]).reduce((a,p)=>{ a[p.action]=(a[p.action]||0)+1; return a; },{});
              const lines = [
                "## "+(s.dryRun?"Dry Run":"Live Sync")+" - KeyCRM and Shopify",
                "- Products parsed: "+s.productsParsed,
                "- Variants parsed: "+s.variantsParsed,
                "- Existing offers: "+s.existingOffersFound,
                "- KeyCRM created/stocks: "+(s.keycrmCreated||0)+"/"+(s.keycrmStockUpdates||0),
                "- Shopify created/stocks: "+(s.shopifyCreated||0)+"/"+(s.shopifyStockUpdates||0),
                "- Warnings: "+(s.warnings||[]).length,
                "","### Plan:","```json",JSON.stringify(counts,null,2),"```"
              ];
              if ((s.warnings||[]).length) {
                lines.push("","### Warnings:");
                for (const w of (s.warnings||[]).slice(0,30)) lines.push("- "+w);
              }
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n")+"\n");
            } catch(err) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "Failed: "+err.message+"\n");
            }
          '